name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned tooling and project
        run: |
          python -m pip install uv==0.12.19
          scripts/install.sh
      - name: Install official Chromium
        run: .venv/bin/playwright install --with-deps chromium
      - name: Lint and format
        run: |
          .venv/bin/ruff check src tests examples/regression
          .venv/bin/ruff format --check src tests examples/regression
      - name: Execute tests
        run: .venv/bin/pytest -q --junitxml=.autotest/ci.junit.xml
      - name: Verify paired defect benchmark
        run: .venv/bin/autotest benchmark --output .autotest/ci-benchmark
      - name: Build distributions
        run: |
          uv build --no-sources
          .venv/bin/python scripts/check_distribution.py
      - name: Retain synthetic demonstration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: synthetic-check-evidence
          path: |
            .autotest/ci.junit.xml
            .autotest/ci-benchmark/
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: warn
          retention-days: 14
