[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "autotest-agent-skill"
version = "0.1.0a1"
description = "Evidence-based web, API, Telegram and Android checks for coding agents"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "PyYAML>=6,<7", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
web = ["playwright>=1.52,<2", "Pillow>=11,<13"]
telegram = ["aiogram>=3.20,<4", "telethon>=1.40,<2"]
android = ["Appium-Python-Client>=5,<6"]
security = ["pip-audit>=2.8,<3"]

[project.scripts]
autotest = "autotest_skill.cli:main"

[project.urls]
Repository = "https://github.com/Zulut30/autotest-skill"
Issues = "https://github.com/Zulut30/autotest-skill/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/autotest_skill"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1.2,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
